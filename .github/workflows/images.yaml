name: Publish base images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-image-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build generic ARM64 images from the locked sources
        run: |
          mkdir artifacts
          # Use the repository's pin for the build tool as well as the image packages.
          revision=$(jq -r .nodes.nixpkgs.locked.rev devenv.lock)
          nix run "github:NixOS/nixpkgs/$revision#devenv" -- build outputs.dev outputs.target > artifacts/builds.json
          for role in dev target; do
            image=$(jq -r --arg output "outputs.$role" '.[$output]' artifacts/builds.json)
            gzip -n -c "$image/nixos-$role.oci.tar" > "artifacts/nixos-$role-aarch64.oci.tar.gz"
          done
      - name: Write download pins and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum ./*.gz > SHA256SUMS
          jq -n \
            --arg dev "$(sha256sum nixos-dev-aarch64.oci.tar.gz | cut -d ' ' -f 1)" \
            --arg target "$(sha256sum nixos-target-aarch64.oci.tar.gz | cut -d ' ' -f 1)" \
            '{dev: {sha256: $dev}, target: {sha256: $target}}' > images.json
          # GitHub requires a tag; reuse one release and move its tag on each publish.
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title Latest --notes 'Current ARM64 NixOS development and target images. Bootstrap creates only the development machine; targets are provisioned separately.'
          fi
          gh release upload latest ./*.gz SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          # Metadata must not advertise new hashes before their image uploads complete.
          gh release upload latest images.json --clobber --repo "$GITHUB_REPOSITORY"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" -F force=true
