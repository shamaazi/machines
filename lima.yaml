vmType: vz
arch: aarch64
disk: 80GiB
images:
  - location: https://github.com/shamaazi/machines/releases/download/latest/nixos-dev-aarch64.qcow2.gz
    arch: aarch64
mounts: []
containerd:
  system: false
  user: false
ssh:
  forwardAgent: false
portForwards:
  # The guest proxy connects to the Mac bridge; forwarding it back creates a loop.
  - guestPort: 2850
    ignore: true
  # NixOS exposes its DHCP client socket; do not forward the Mac's DHCP port.
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true

